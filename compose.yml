services:
  app:
    build:
      context: .
      target: dev
    command: npm run start:dev
    working_dir: /app
    ports:
      - '3000:3000'
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
    volumes:
      - .:/app
      - /app/node_modules
